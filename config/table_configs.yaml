# Table Configurations
# ====================
# Define coordinates and settings for each Excel file you want to ingest.
#
# Format:
#   file_key:                    # Unique identifier for this file
#     s3_key: "path/in/bucket"   # S3 key in raw bucket
#     tables:                    # List of tables to extract
#       - sheet: "Sheet1"        # Sheet name containing this table
#         table_id: "my_table"   # ID for the resulting table
#         start_cell: "A1"       # Top-left cell of data (headers)
#         end_cell: "Z100"       # Bottom-right cell (null = auto-detect)
#
# Multiple tables on same sheet:
#   multi_table_file:
#     s3_key: "report.xlsx"
#     tables:
#       - sheet: "Data"
#         table_id: "customers"
#         start_cell: "A1"
#         end_cell: "K50"
#       - sheet: "Data"          # Same sheet, different region
#         table_id: "orders"
#         start_cell: "A55"
#         end_cell: "M150"
#       - sheet: "Summary"       # Different sheet
#         table_id: "summary"
#         start_cell: "B2"
#         end_cell: null

# Example configuration:
# -----------------------

financial_sample:
  s3_key: "financial_sample.xlsx"
  tables:
    - sheet: "Sheet1"
      table_id: "financial_data"
      start_cell: "A1"
      end_cell: null  # Auto-detect end

